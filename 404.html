<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Vivek Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #1e1e1e;
      --accent: #c8f135;
      --text: #e8e8e8;
      --muted: #888;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 55px rgba(0, 0, 0, 0.45);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(200, 241, 53, 0.08);
      border: 1px solid rgba(200, 241, 53, 0.25);
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 36px);
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    a, button {
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      color: var(--text);
      background: #161616;
    }

    a:hover, button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .primary {
      background: var(--accent);
      color: #0b0b0b;
      border-color: var(--accent);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
      border-style: dashed;
    }

    .contact {
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
    }

    .contact a { color: var(--text); text-decoration: underline; }

    @media (max-width: 540px) {
      .card { padding: 28px 20px; }
      .actions { flex-direction: column; }
      a, button { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">Not found</div>
    <h1>Looks like you hit a dead end</h1>
    <p>
      The page you’re looking for doesn’t exist or may have moved. Try heading back to the homepage or reload the page if you think this is an error.
    </p>
    <div class="actions">
      <a class="primary" href="index.html">← Back to homepage</a>
      <button class="muted" type="button" id="retry-btn">Retry</button>
    </div>
    <div class="contact">
      Still stuck? Email <a href="mailto:59245@gbpuat.ac.in">59245@gbpuat.ac.in</a> and I’ll help fix it.
    </div>
  </div>

  <script>
    document.getElementById('retry-btn')?.addEventListener('click', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
